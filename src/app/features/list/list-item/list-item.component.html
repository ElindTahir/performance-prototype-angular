<div class="item" (click)="openDetail()">
  <div class="name">
    {{ item.name }}
  </div>

  <div class="meta">
    <span>Category: {{ item.category }}</span>
    <span>Value: {{ item.value }}</span>
    <span>Status: {{ item.status }}</span>
  </div>

  <div class="date">
    {{ item.date }}
  </div>
</div>
